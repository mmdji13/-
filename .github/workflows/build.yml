name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init Hesab com.hesab.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: App name and icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">حساب من</string>|' $RES/values/strings.xml || true
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">حساب من</string>|' $RES/values/strings.xml || true
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $RES/mipmap-$d
            for n in ic_launcher ic_launcher_round; do
              if command -v magick >/dev/null 2>&1; then
                magick icon-512.png -resize ${s}x${s} $RES/mipmap-$d/$n.png
              else
                convert icon-512.png -resize ${s}x${s} $RES/mipmap-$d/$n.png
              fi
            done
          done

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hesab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">حساب من</string>|' $RES/values/strings.xml || true
          sed -i 's|<color name="colorPrimaryDark">.*</color>|<color name="colorPrimaryDark">#0B4F5C</color>|' $RES/values/colors.xml || true
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $RES/mipmap-$d
            for n in ic_launcher ic_launcher_round; do
              if command -v magick >/dev/null 2>&1; then
                magick icon-512.png -resize ${s}x${s} $RES/mipmap-$d/$n.png
              else
                convert icon-512.png -resize ${s}x${s} $RES/mipmap-$d/$n.png
              fi
            done
          done

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hesab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
