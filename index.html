<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4F5C">
<meta name="mobile-web-app-capable" content="yes">
<title>حساب من</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --sea:#0B4F5C; --mint:#7FE0C3; --coral:#FF8F7E; --saffron:#F2B134;
  --ink:#16282D; --muted:#566A6F; --line:#DCE3E3; --paper:#F4F6F5;
  --in:#0A7A6A; --out:#C23B4F;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;font-size:16px;line-height:1.6;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

/* Hero */
.hero{background:var(--sea);color:#fff;padding:calc(var(--safe-t) + 12px) 20px 26px;border-radius:0 0 28px 28px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav h1{margin:0;font-size:18px;font-weight:700;min-width:130px;text-align:center}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.icon-btn:active{background:rgba(255,255,255,.14)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero .label{margin:0;font-size:14px;opacity:.85}
.net{display:flex;align-items:baseline;gap:8px;margin:0 0 16px}
.net b{font-size:46px;line-height:1.25;font-weight:800}
.net span{font-size:15px;opacity:.85}
.split{display:flex;gap:3px;height:12px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.18)}
.split i{display:block;min-width:0;transition:flex-grow .35s}
.split .in{background:var(--mint)} .split .out{background:var(--coral)}
.pair{display:flex;justify-content:space-between;gap:12px;margin-top:14px}
.pair div{display:flex;flex-direction:column}
.pair small{font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px}
.pair small::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--mint)}
.pair .o small::before{background:var(--coral)}
.pair b{font-size:19px;font-weight:700}
.total{margin:16px 0 0;font-size:13px;opacity:.8}

/* Content */
main{padding:22px 0 130px}
.section-title{margin:0 20px 10px;font-size:15px;font-weight:700;color:var(--muted)}
.cats{padding:0 20px;margin-bottom:26px}
.cat{margin-bottom:12px}
.cat .r{display:flex;justify-content:space-between;font-size:15px}
.cat .r b{font-weight:700}
.cat .bar{height:6px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
.cat .bar i{display:block;height:100%;background:var(--out);border-radius:3px}
.day{margin:0;padding:14px 20px 6px;font-size:14px;font-weight:700;color:var(--muted)}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:11px 20px;text-align:start;border-bottom:1px solid var(--line);background:transparent}
.row:active{background:#E8EEEE}
.row .dot{width:4px;align-self:stretch;min-height:30px;border-radius:2px;background:var(--out);flex:none}
.row.in .dot{background:var(--in)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:16px}
.row .t span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-weight:800;font-size:16px;color:var(--out);white-space:nowrap}
.row.in .a{color:var(--in)}
.row .tag{font-size:12px;font-weight:600;color:var(--in);margin-inline-start:6px}
.empty{margin:36px 28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.fab{position:fixed;left:20px;bottom:calc(22px + var(--safe-b));width:60px;height:60px;border-radius:50%;background:var(--saffron);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(11,79,92,.35)}
.fab:active{transform:scale(.96)}
.fab svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}

/* Sheets */
.backdrop{position:fixed;inset:0;background:rgba(9,32,38,.5);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s;z-index:10}
.backdrop.open{opacity:1;visibility:visible;transition:opacity .25s}
.sheet{position:fixed;right:0;left:0;bottom:0;z-index:11;background:#fff;border-radius:24px 24px 0 0;padding:18px 20px calc(20px + var(--safe-b));max-height:92vh;overflow-y:auto;transform:translateY(100%);visibility:hidden;transition:transform .25s,visibility 0s .25s}
.sheet.open{transform:none;visibility:visible;transition:transform .25s}
.sheet h2{margin:0 0 14px;font-size:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#E8EEEE;border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{padding:10px;border-radius:11px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[data-type=out][aria-pressed=true]{color:var(--out)}
.seg button[data-type=in][aria-pressed=true]{color:var(--in)}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:4px;margin-bottom:6px}
.amount:focus-within{border-color:var(--sea)}
.amount input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:36px;font-weight:800;padding:0}
.amount span{color:var(--muted)}
.err{min-height:22px;margin:0 0 8px;color:var(--out);font-size:14px}
.field-label{display:block;margin:10px 0 8px;font-size:14px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:999px;border:1.5px solid #C6D3D4;font-size:15px}
.chip[aria-pressed=true]{background:var(--sea);border-color:var(--sea);color:#fff}
.text{width:100%;border:1.5px solid #C6D3D4;border-radius:12px;padding:10px 12px;background:#fff}
.text:focus{outline:0;border-color:var(--sea)}
.datesel{display:none;gap:8px;margin-top:10px}
.datesel.show{display:flex}
.datesel select{flex:1;min-width:0;border:1.5px solid #C6D3D4;border-radius:12px;padding:9px 8px;background:#fff}
.actions{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:13px;border-radius:14px;font-weight:700;font-size:16px}
.btn.primary{background:var(--sea);color:#fff}
.btn.danger{flex:none;padding:13px 18px;background:#FBE6E9;color:var(--out)}
.btn.plain{background:#EEF3F3;text-align:start;padding:14px 16px;margin-bottom:10px;width:100%;font-weight:600}
.btn.plain.warn{color:var(--out)}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}

.toast{position:fixed;right:16px;left:16px;bottom:calc(96px + var(--safe-b));z-index:20;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .2s,transform .2s,visibility 0s .2s}
.toast.show{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .2s}
.toast button{color:var(--saffron);font-weight:700;padding:4px 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:640px){body{max-width:520px;margin:0 auto;box-shadow:0 0 0 1px var(--line)} .sheet,.toast{max-width:520px;margin:0 auto}}
</style>
</head>
<body>

<header class="hero">
  <div class="topbar">
    <div class="monthnav">
      <button class="icon-btn" id="prev" aria-label="ماه قبل"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <h1 id="monthLabel"></h1>
      <button class="icon-btn" id="next" aria-label="ماه بعد"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="پشتیبان‌گیری و تنظیمات"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg></button>
  </div>
  <p class="label" id="netLabel">مانده این ماه</p>
  <div class="net"><b id="net">۰</b><span>تومان</span></div>
  <div class="split" id="split" role="img" aria-label="نسبت درآمد به هزینه"><i class="in" id="barIn"></i><i class="out" id="barOut"></i></div>
  <div class="pair">
    <div><small>درآمد</small><b id="sumIn">۰</b></div>
    <div class="o"><small>هزینه</small><b id="sumOut">۰</b></div>
  </div>
  <p class="total" id="total"></p>
</header>

<main>
  <div id="cats"></div>
  <div id="list"></div>
</main>

<button class="fab" id="fab" aria-label="ثبت تراکنش جدید"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="backdrop" id="backdrop"></div>

<!-- Add / edit sheet -->
<section class="sheet" id="txSheet" aria-hidden="true" aria-labelledby="txTitle">
  <h2 id="txTitle">تراکنش جدید</h2>
  <div class="seg" role="group" aria-label="نوع تراکنش">
    <button type="button" data-type="out" aria-pressed="true">هزینه</button>
    <button type="button" data-type="in" aria-pressed="false">درآمد</button>
  </div>
  <div class="amount">
    <input id="amount" inputmode="numeric" autocomplete="off" placeholder="۰" aria-label="مبلغ">
    <span>تومان</span>
  </div>
  <p class="err" id="err" role="alert"></p>
  <span class="field-label">دسته</span>
  <div class="chips" id="catChips"></div>
  <label class="field-label" for="note">توضیح (اختیاری)</label>
  <input class="text" id="note" maxlength="80" autocomplete="off" placeholder="مثلاً: نان و ماست">
  <span class="field-label">تاریخ</span>
  <div class="chips" id="dateChips">
    <button type="button" class="chip" data-d="today">امروز</button>
    <button type="button" class="chip" data-d="yesterday">دیروز</button>
    <button type="button" class="chip" data-d="custom">تاریخ دیگر</button>
  </div>
  <div class="datesel" id="dateSel">
    <select id="sd" aria-label="روز"></select>
    <select id="sm" aria-label="ماه"></select>
    <select id="sy" aria-label="سال"></select>
  </div>
  <div class="actions">
    <button type="button" class="btn danger" id="delBtn" hidden>حذف</button>
    <button type="button" class="btn primary" id="saveBtn">ذخیره</button>
  </div>
</section>

<!-- Menu sheet -->
<section class="sheet" id="menuSheet" aria-hidden="true" aria-labelledby="menuTitle">
  <h2 id="menuTitle">پشتیبان‌گیری</h2>
  <button class="btn plain" id="exportBtn">ذخیرهٔ فایل پشتیبان</button>
  <button class="btn plain" id="importBtn">بازیابی از فایل پشتیبان</button>
  <p class="hint">اطلاعات فقط روی همین گوشی ذخیره می‌شود. اگر برنامه را حذف کنی یا اطلاعات مرورگر را پاک کنی، از بین می‌رود؛ پس گاهی فایل پشتیبان بگیر.</p>
  <button class="btn plain warn" id="wipeBtn" style="margin-top:16px">پاک کردن همهٔ اطلاعات</button>
  <input type="file" id="file" accept="application/json,.json" hidden>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script>
(() => {
'use strict';

/* ---------- Constants ---------- */
const KEY = 'hesab-v1';
const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const CATS = {
  out: ['خوراک','حمل‌ونقل','خانه و اجاره','قبض','خرید','سلامت','تفریح','آموزش','سایر'],
  in:  ['حقوق','درآمد جانبی','هدیه','سایر']
};
const nfGroup = new Intl.NumberFormat('fa-IR');
const nfPlain = new Intl.NumberFormat('fa-IR', { useGrouping: false });
const fmt = n => nfGroup.format(Math.round(n));
const fa = n => nfPlain.format(n);
const toEn = s => String(s)
  .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
  .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

/* ---------- Jalali <-> Gregorian ---------- */
function g2j(gy, gm, gd) {
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  const gy2 = gm > 2 ? gy + 1 : gy;
  let days = 355666 + 365*gy + ~~((gy2+3)/4) - ~~((gy2+99)/100) + ~~((gy2+399)/400) + gd + g_d_m[gm-1];
  let jy = -1595 + 33*~~(days/12053); days %= 12053;
  jy += 4*~~(days/1461); days %= 1461;
  if (days > 365) { jy += ~~((days-1)/365); days = (days-1) % 365; }
  const jm = days < 186 ? 1 + ~~(days/31) : 7 + ~~((days-186)/30);
  const jd = 1 + (days < 186 ? days % 31 : (days-186) % 30);
  return [jy, jm, jd];
}
function j2g(jy, jm, jd) {
  jy += 1595;
  let days = -355668 + 365*jy + ~~(jy/33)*8 + ~~(((jy%33)+3)/4) + jd + (jm < 7 ? (jm-1)*31 : (jm-7)*30 + 186);
  let gy = 400*~~(days/146097); days %= 146097;
  if (days > 36524) { gy += 100*~~(--days/36524); days %= 36524; if (days >= 365) days++; }
  gy += 4*~~(days/1461); days %= 1461;
  if (days > 365) { gy += ~~((days-1)/365); days = (days-1) % 365; }
  let gd = days + 1;
  const sal = [0,31,((gy%4===0&&gy%100!==0)||gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm;
  for (gm = 0; gm < 13; gm++) { const v = sal[gm]; if (gd <= v) break; gd -= v; }
  return [gy, gm, gd];
}
const pad = n => String(n).padStart(2, '0');
const isoOf = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const parseISO = s => s.split('-').map(Number);
const jOf = iso => g2j(...parseISO(iso));
const isoFromJ = (jy, jm, jd) => isoOf(...j2g(jy, jm, jd));
const todayISO = () => { const t = new Date(); return isoOf(t.getFullYear(), t.getMonth()+1, t.getDate()); };
const addDays = (iso, n) => { const [y,m,d] = parseISO(iso); const t = new Date(y, m-1, d+n, 12); return isoOf(t.getFullYear(), t.getMonth()+1, t.getDate()); };
const isLeapJ = y => { const r = g2j(...j2g(y, 12, 30)); return r[1] === 12 && r[2] === 30; };
const daysInJ = (y, m) => m < 7 ? 31 : m < 12 ? 30 : (isLeapJ(y) ? 30 : 29);

function dayLabel(iso) {
  const [y, m, d] = parseISO(iso);
  const wd = new Date(y, m-1, d, 12).toLocaleDateString('fa-IR', { weekday: 'long' });
  const j = jOf(iso);
  const base = `${wd}، ${fa(j[2])} ${MONTHS[j[1]-1]}`;
  const t = todayISO();
  if (iso === t) return `امروز، ${fa(j[2])} ${MONTHS[j[1]-1]}`;
  if (iso === addDays(t, -1)) return `دیروز، ${fa(j[2])} ${MONTHS[j[1]-1]}`;
  return base;
}

/* ---------- Storage ---------- */
let memStore = null;
const store = {
  get() { try { return localStorage.getItem(KEY); } catch (e) { return memStore; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) { memStore = v; } }
};
function sanitize(list) {
  if (!Array.isArray(list)) return [];
  return list.filter(x => x && (x.type === 'in' || x.type === 'out')
      && Number.isFinite(+x.amount) && +x.amount > 0
      && typeof x.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x.date))
    .map(x => ({
      id: String(x.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 6)),
      ts: Number.isFinite(+x.ts) ? +x.ts : Date.now(),
      type: x.type, amount: Math.round(+x.amount),
      cat: String(x.cat || 'سایر').slice(0, 40),
      note: String(x.note || '').slice(0, 80),
      date: x.date
    }));
}
function load() { try { return sanitize(JSON.parse(store.get() || '[]')); } catch (e) { return []; } }
let tx = load();
const save = () => store.set(JSON.stringify(tx));
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- State ---------- */
const t0 = jOf(todayISO());
const cur = { y: t0[0], m: t0[1] };
const form = { id: null, type: 'out', cat: 'خوراک', date: todayISO(), custom: false };

/* ---------- Render ---------- */
function render() {
  $('monthLabel').textContent = `${MONTHS[cur.m-1]} ${fa(cur.y)}`;
  const items = tx.filter(x => { const j = jOf(x.date); return j[0] === cur.y && j[1] === cur.m; })
    .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.ts - a.ts);

  let sIn = 0, sOut = 0;
  items.forEach(x => { x.type === 'in' ? sIn += x.amount : sOut += x.amount; });
  const net = sIn - sOut;
  $('netLabel').textContent = net < 0 ? 'کسری این ماه' : 'مانده این ماه';
  $('net').textContent = fmt(Math.abs(net));
  $('sumIn').textContent = fmt(sIn);
  $('sumOut').textContent = fmt(sOut);
  $('barIn').style.flexGrow = sIn; $('barOut').style.flexGrow = sOut;
  $('barIn').style.flexBasis = '0'; $('barOut').style.flexBasis = '0';

  const all = tx.reduce((s, x) => s + (x.type === 'in' ? x.amount : -x.amount), 0);
  $('total').textContent = `${all < 0 ? 'کسری کل' : 'مانده کل'}: ${fmt(Math.abs(all))} تومان`;

  // category breakdown
  const byCat = {};
  items.filter(x => x.type === 'out').forEach(x => { byCat[x.cat] = (byCat[x.cat] || 0) + x.amount; });
  const rows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const max = rows.length ? rows[0][1] : 1;
  $('cats').innerHTML = rows.length
    ? `<h3 class="section-title">هزینه‌ها به تفکیک دسته</h3><div class="cats">${rows.map(([c, v]) =>
        `<div class="cat"><div class="r"><span>${esc(c)}</span><b>${fmt(v)}</b></div><div class="bar"><i style="width:${Math.max(3, v / max * 100)}%"></i></div></div>`).join('')}</div>`
    : '';

  // list
  if (!items.length) {
    $('list').innerHTML = `<div class="empty"><b>این ماه چیزی ثبت نشده</b>با دکمهٔ + اولین درآمد یا هزینه را اضافه کن.</div>`;
    return;
  }
  let html = '<h3 class="section-title">تراکنش‌ها</h3>', last = '';
  items.forEach(x => {
    if (x.date !== last) { html += `<h4 class="day">${dayLabel(x.date)}</h4>`; last = x.date; }
    html += `<button class="row ${x.type}" data-id="${esc(x.id)}"><span class="dot"></span><span class="t"><b>${esc(x.cat)}${x.type === 'in' ? '<span class="tag">درآمد</span>' : ''}</b>${x.note ? `<span>${esc(x.note)}</span>` : ''}</span><span class="a">${fmt(x.amount)}</span></button>`;
  });
  $('list').innerHTML = html;
}

/* ---------- Sheets ---------- */
let openEl = null;
function openSheet(el) {
  if (openEl) return;
  openEl = el;
  el.classList.add('open'); el.setAttribute('aria-hidden', 'false');
  $('backdrop').classList.add('open');
  try { history.pushState({ sheet: 1 }, ''); } catch (e) {}
}
function closeSheet(viaPop) {
  if (!openEl) return;
  openEl.classList.remove('open'); openEl.setAttribute('aria-hidden', 'true');
  $('backdrop').classList.remove('open');
  openEl = null;
  if (!viaPop) { try { if (history.state && history.state.sheet) history.back(); } catch (e) {} }
  if (document.activeElement) document.activeElement.blur();
}
window.addEventListener('popstate', () => { if (openEl) closeSheet(true); });
$('backdrop').addEventListener('click', () => closeSheet());
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, actLabel, act) {
  $('toastMsg').textContent = msg;
  const b = $('toastAct');
  if (actLabel) { b.hidden = false; b.textContent = actLabel; b.onclick = () => { act(); hideToast(); }; }
  else { b.hidden = true; b.onclick = null; }
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actLabel ? 5000 : 2200);
}
const hideToast = () => $('toast').classList.remove('show');

/* ---------- Add / edit form ---------- */
function drawCats() {
  $('catChips').innerHTML = CATS[form.type].map(c =>
    `<button type="button" class="chip" data-c="${esc(c)}" aria-pressed="${c === form.cat}">${esc(c)}</button>`).join('');
}
function drawSeg() {
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.type === form.type));
}
function drawDate() {
  const t = todayISO();
  const state = { today: form.date === t && !form.custom, yesterday: form.date === addDays(t, -1) && !form.custom, custom: form.custom };
  document.querySelectorAll('#dateChips .chip').forEach(b => b.setAttribute('aria-pressed', !!state[b.dataset.d]));
  $('dateSel').classList.toggle('show', form.custom);
  if (form.custom) {
    const [jy, jm, jd] = jOf(form.date);
    const ty = t0[0];
    const y0 = Math.min(ty - 4, jy), y1 = Math.max(ty + 1, jy);
    let ys = ''; for (let y = y1; y >= y0; y--) ys += `<option value="${y}"${y === jy ? ' selected' : ''}>${fa(y)}</option>`;
    $('sy').innerHTML = ys;
    $('sm').innerHTML = MONTHS.map((n, i) => `<option value="${i+1}"${i+1 === jm ? ' selected' : ''}>${n}</option>`).join('');
    fillDays(jy, jm, jd);
  }
}
function fillDays(jy, jm, jd) {
  const n = daysInJ(jy, jm);
  let s = ''; for (let d = 1; d <= n; d++) s += `<option value="${d}"${d === Math.min(jd, n) ? ' selected' : ''}>${fa(d)}</option>`;
  $('sd').innerHTML = s;
}
function onDateSel(e) {
  let jy = +$('sy').value, jm = +$('sm').value, jd = +$('sd').value;
  if (e.target.id !== 'sd') { fillDays(jy, jm, jd); jd = +$('sd').value; }
  form.date = isoFromJ(jy, jm, jd);
}
['sy', 'sm', 'sd'].forEach(id => $(id).addEventListener('change', onDateSel));

function openForm(id) {
  const x = id ? tx.find(t => t.id === id) : null;
  form.id = x ? x.id : null;
  form.type = x ? x.type : 'out';
  form.cat = x ? x.cat : CATS[form.type][0];
  form.date = x ? x.date : todayISO();
  const t = todayISO();
  form.custom = !!x && x.date !== t && x.date !== addDays(t, -1);
  $('txTitle').textContent = x ? 'ویرایش تراکنش' : 'تراکنش جدید';
  $('amount').value = x ? fmt(x.amount) : '';
  $('note').value = x ? x.note : '';
  $('err').textContent = '';
  $('delBtn').hidden = !x;
  if (x && !CATS[form.type].includes(form.cat)) CATS[form.type].push(form.cat);
  drawSeg(); drawCats(); drawDate();
  openSheet($('txSheet'));
  if (!x) setTimeout(() => $('amount').focus(), 280);
}
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  form.type = b.dataset.type; form.cat = CATS[form.type][0]; drawSeg(); drawCats();
}));
$('catChips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  form.cat = b.dataset.c; drawCats();
});
$('dateChips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const t = todayISO();
  if (b.dataset.d === 'today') { form.date = t; form.custom = false; }
  else if (b.dataset.d === 'yesterday') { form.date = addDays(t, -1); form.custom = false; }
  else form.custom = true;
  drawDate();
});
$('amount').addEventListener('input', e => {
  const digits = toEn(e.target.value).replace(/\D/g, '').slice(0, 13);
  e.target.value = digits ? fmt(+digits) : '';
  $('err').textContent = '';
});
$('saveBtn').addEventListener('click', () => {
  const amount = parseInt(toEn($('amount').value).replace(/\D/g, ''), 10) || 0;
  if (amount <= 0) { $('err').textContent = 'مبلغ را وارد کن.'; $('amount').focus(); return; }
  const rec = { type: form.type, amount, cat: form.cat, note: $('note').value.trim(), date: form.date };
  if (form.id) {
    const i = tx.findIndex(t => t.id === form.id);
    if (i > -1) tx[i] = { ...tx[i], ...rec };
  } else {
    tx.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(), ...rec });
  }
  save();
  const j = jOf(form.date); cur.y = j[0]; cur.m = j[1];
  closeSheet(); render(); toast('ذخیره شد');
});
$('delBtn').addEventListener('click', () => {
  const i = tx.findIndex(t => t.id === form.id); if (i < 0) return;
  const [gone] = tx.splice(i, 1); save();
  closeSheet(); render();
  toast('حذف شد', 'بازگردانی', () => { tx.push(gone); save(); render(); });
});

/* ---------- Main interactions ---------- */
$('fab').addEventListener('click', () => openForm());
$('list').addEventListener('click', e => { const r = e.target.closest('.row'); if (r) openForm(r.dataset.id); });
$('prev').addEventListener('click', () => { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } render(); });
$('next').addEventListener('click', () => { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } render(); });

/* ---------- Backup ---------- */
$('menuBtn').addEventListener('click', () => openSheet($('menuSheet')));
$('exportBtn').addEventListener('click', async () => {
  const j = jOf(todayISO());
  const name = `hesab-backup-${j[0]}${pad(j[1])}${pad(j[2])}.json`;
  const json = JSON.stringify({ app: 'hesab', v: 1, tx }, null, 2);
  const cap = window.Capacitor;
  if (cap && cap.isNativePlatform && cap.isNativePlatform()) {
    try {
      const { Filesystem, Share } = cap.Plugins;
      const w = await Filesystem.writeFile({ path: name, data: json, directory: 'CACHE', encoding: 'utf8' });
      await Share.share({ title: 'پشتیبان حساب من', url: w.uri, dialogTitle: 'ذخیرهٔ فایل پشتیبان' });
      closeSheet();
    } catch (err) { toast('فایل پشتیبان ذخیره نشد'); }
    return;
  }
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  closeSheet(); toast('فایل پشتیبان ذخیره شد');
});
$('importBtn').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      const list = sanitize(Array.isArray(data) ? data : data.tx);
      if (!list.length) throw new Error('empty');
      if (!confirm(`${fa(list.length)} تراکنش پیدا شد. اطلاعات فعلی با آن‌ها جایگزین شود؟`)) return;
      tx = list; save(); closeSheet(); render(); toast('اطلاعات بازیابی شد');
    } catch (err) { closeSheet(); toast('این فایل پشتیبان معتبر نیست'); }
  };
  r.readAsText(f); e.target.value = '';
});
$('wipeBtn').addEventListener('click', () => {
  if (!confirm('همهٔ تراکنش‌ها برای همیشه پاک شود؟')) return;
  tx = []; save(); closeSheet(); render(); toast('همه‌چیز پاک شد');
});

/* ---------- Start ---------- */
render();
const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
if (!isNative && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
</html>
